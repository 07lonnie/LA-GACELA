<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticia - La Gacela</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Convertidor Markdown a HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- ENCABEZADO EDITORIAL -->
  <header class="encabezado">
    <div class="top-bar">
      <span>Edición Digital | 2026</span>
      <button id="btn-modo">🌙 Modo Oscuro</button>
    </div>
    <a href="index.html" style="text-decoration:none;"><h1 class="logo">LA GACELA</h1></a>
    <p class="slogan">Información con agilidad, rigor y elegancia</p>
  </header>

  <!-- SECCIÓN PRINCIPAL DE LA NOTICIA -->
  <article class="noticia-periodistica-container">
    
    <!-- 1. VOLADA / CATEGORÍA -->
    <div class="noticia-volada" id="art-volada">POLÍTICA</div>

    <!-- 2. TITULAR PRINCIPAL -->
    <h1 class="noticia-titular" id="art-titulo">Cargando titular de la noticia...</h1>

    <!-- 3. BAJADA O RESUMEN -->
    <p class="noticia-bajada" id="art-bajada"></p>

    <!-- 4. CRÉDITO Y FECHA DE PUBLICACIÓN -->
    <div class="noticia-creditos-fecha">
      <div class="autor-info">
        <span>Por <strong id="art-autor">Redacción La Gacela</strong></span>
      </div>
      <div class="fecha-info">
        <span id="art-fecha">24 de Agosto, 2026</span>
      </div>
    </div>

    <!-- 5. FOTOGRAFÍA PRINCIPAL Y LEYENDA -->
    <figure class="noticia-media-wrapper" id="contenedor-foto" style="display:none;">
      <div class="marco-imagen">
        <img id="art-foto" src="" alt="Imagen periodística">
      </div>
      <figcaption class="noticia-leyenda" id="art-pie-foto"></figcaption>
    </figure>

    <!-- 6. CUERPO DE LA NOTICIA (LEAD + DESARROLLO) -->
    <div class="noticia-cuerpo-redaccion" id="art-cuerpo"></div>

    <!-- 7. RECURSO DE VIDEO (SI TIENE YOUTUBE) -->
    <div class="noticia-recurso-video" id="contenedor-video" style="display:none;">
      <h4 class="subtitulo-recurso">cobertura en video:</h4>
      <div class="iframe-responsive">
        <iframe id="art-video" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>

    <!-- 8. ETIQUETAS / SEPA MÁS (TAGS) -->
    <div class="noticia-sepa-mas" id="contenedor-tags">
      <h3>Sepa más:</h3>
      <div class="tags-list">
        <span class="tag-item">La Gacela</span>
        <span class="tag-item">UNFV</span>
        <span class="tag-item">Periodismo</span>
      </div>
    </div>

    <!-- BOTÓN VOLVER -->
    <div class="volver-contenedor">
      <a href="index.html" class="btn-volver-portada">← Volver a la portada</a>
    </div>

  </article>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const archivoNoticia = params.get('id');

      if (!archivoNoticia) {
        document.getElementById('art-titulo').textContent = 'Noticia no especificada';
        return;
      }

      try {
        const respuesta = await fetch(`contenido/noticias/${archivoNoticia}`);
        if (!respuesta.ok) throw new Error('No se pudo encontrar la nota');
        
        const texto = await respuesta.text();
        const partes = texto.split('---');
        if (partes.length < 3) return;

        const metadatosRaw = partes[1];
        const cuerpoMarkdown = partes.slice(2).join('---');

        const obtenerValor = (clave) => {
          const regex = new RegExp(`^${clave}:\\s*["']?(.*?)["']?$`, 'm');
          const match = metadatosRaw.match(regex);
          return match ? match[1].trim() : '';
        };

        // Formateador ortográfico de categorías con tildes
        const normalizarCategoria = (cat) => {
          const mapa = {
            'politica': 'POLÍTICA',
            'internacionales': 'INTERNACIONALES',
            'espectaculos': 'ESPECTÁCULOS',
            'deportes': 'DEPORTES'
          };
          return mapa[cat.toLowerCase()] || cat.toUpperCase();
        };

        const titulo = obtenerValor('title');
        const categoria = obtenerValor('categoria');
        const autor = obtenerValor('autor');
        const fecha = obtenerValor('date');
        const bajada = obtenerValor('bajada');
        const thumbnail = obtenerValor('thumbnail');
        const pieFoto = obtenerValor('pie_foto');
        const videoUrl = obtenerValor('video_url');

        document.title = `${titulo} - La Gacela`;
        document.getElementById('art-titulo').textContent = titulo;
        document.getElementById('art-volada').textContent = normalizarCategoria(categoria);
        document.getElementById('art-autor').textContent = autor || 'Redacción La Gacela';
        document.getElementById('art-fecha').textContent = fecha;
        document.getElementById('art-bajada').textContent = bajada;

        // Mostrar imagen garantizando que NO se recorte
        if (thumbnail) {
          const img = document.getElementById('art-foto');
          img.src = thumbnail;
          document.getElementById('contenedor-foto').style.display = 'block';
        }

        if (pieFoto) {
          document.getElementById('art-pie-foto').textContent = pieFoto;
        }

        // Mostrar video si existe
        if (videoUrl) {
          const videoFrame = document.getElementById('art-video');
          let embedUrl = videoUrl;
          if (videoUrl.includes('watch?v=')) {
            embedUrl = videoUrl.replace('watch?v=', 'embed/');
          } else if (videoUrl.includes('youtu.be/')) {
            embedUrl = videoUrl.replace('youtu.be/', 'www.youtube.com/embed/');
          }
          videoFrame.src = embedUrl;
          document.getElementById('contenedor-video').style.display = 'block';
        }

        // Cargar cuerpo enriquecido
        document.getElementById('art-cuerpo').innerHTML = marked.parse(cuerpoMarkdown);

      } catch (e) {
        document.getElementById('art-titulo').textContent = 'Error al cargar la noticia seleccionada';
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
