# Configuración de DecapBridge PKCE para La Gacela
backend:
  name: git-gateway
  repo: 07lonnie/LA-GACELA
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/6f935bce-10e7-4f4f-acee-854e0d188d8a/pkce
  auth_token_endpoint: /sites/6f935bce-10e7-4f4f-acee-854e0d188d8a/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://la-gacela.vercel.app
display_url: https://la-gacela.vercel.app

# Dónde se guardan las imágenes subidas por los periodistas
media_folder: "fotos/subidas"
public_folder: "fotos/subidas"

# Definición del formulario editorial para tus compañeros
collections:
  - name: "noticias"
    label: "Noticias"
    folder: "contenido/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título de la Noticia", name: "title", widget: "string" }
      - { label: "Categoría", name: "categoria", widget: "select", options: ["politica", "internacionales", "espectaculos", "deportes"] }
      - { label: "Autor (Redactor)", name: "autor", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "Bajada / Resumen breve", name: "bajada", widget: "text" }
      - { label: "Imagen de Portada (16:9)", name: "thumbnail", widget: "image", required: false }
      - { label: "Pie de Foto", name: "pie_foto", widget: "string", required: false }
      - { label: "Enlace de Video (YouTube)", name: "video_url", widget: "string", required: false }
      - { label: "Cuerpo de la Noticia", name: "body", widget: "markdown" }