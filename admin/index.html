<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Editorial - La Gacela</title>
  
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script async src="https://www.tiktok.com/embed.js"></script>
  
  <script>
    CMS.init({
      config: {
        load_config_file: false,
        backend: {
          name: "git-gateway",
          repo: "07lonnie/LA-GACELA",
          branch: "main",
          auth_type: "pkce",
          base_url: "https://auth.decapbridge.com",
          auth_endpoint: "/sites/6f935bce-10e7-4f4f-acee-854e0d188d8a/pkce",
          auth_token_endpoint: "/sites/6f935bce-10e7-4f4f-acee-854e0d188d8a/token",
          gateway_url: "https://gateway.decapbridge.com"
        },
        logo_url: "https://decapbridge.com/decapcms-with-bridge.svg",
        site_url: "https://la-gacela.vercel.app",
        media_folder: "fotos/subidas",
        public_folder: "fotos/subidas",
        collections: [
          {
            name: "noticias",
            label: "Noticias",
            folder: "contenido/noticias",
            create: true,
            slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
            fields: [
              { label: "1. Volada / Antetítulo (Opcional)", name: "volada", widget: "string", required: false, hint: "Ejemplo: GOBIERNO, CRISIS INSTITUCIONAL" },
              { label: "2. Titular Principal (Encabezado)", name: "title", widget: "string", hint: "Titular informativo principal" },
              { 
                label: "3. Categoría", 
                name: "categoria", 
                widget: "select", 
                options: [
                  { label: "Política", value: "politica" },
                  { label: "Internacionales", value: "internacionales" },
                  { label: "Espectáculos", value: "espectaculos" },
                  { label: "Deportes", value: "deportes" }
                ]
              },
              { label: "4. Bajada / Sumario", name: "bajada", widget: "markdown", buttons: ["bold", "italic", "link"], hint: "Síntesis inicial que va debajo del titular" },
              { 
                label: "5. Fecha de Publicación", 
                name: "date", 
                widget: "datetime", 
                format: "YYYY-MM-DD", 
                dateFormat: "YYYY-MM-DD", 
                timeFormat: false,
                pickerUtc: false
              },
              { label: "6. Lead / Entradilla (Opcional)", name: "lead", widget: "markdown", required: false, buttons: ["bold", "italic", "link"], hint: "Primer párrafo destacado" },
              { label: "7. Fotografía Principal (Portada)", name: "thumbnail", widget: "image", required: false },
              { label: "8. Leyenda / Pie de Foto Principal", name: "pie_foto", widget: "string", required: false, hint: "Ejemplo: Dina Boluarte en el Congreso. | Fuente: Presidencia" },
              { label: "9. Etiquetas / Sepa más (separadas por comas)", name: "tags", widget: "string", required: false, hint: "Ejemplo: Congreso, Elecciones, Política" },
              { label: "10. Cuerpo de la Noticia (Párrafos, fotos, videos y redes sociales)", name: "body", widget: "markdown", hint: "Pega en su propia línea enlaces de YouTube, tweets (X) o TikTok para que se incrusten automáticamente." }
            ]
          }
        ]
      }
    });

    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap");
    CMS.registerPreviewStyle("../styles.css");

    // PROCESADOR DE ENLACES Y FOTOS PARA EL PANEL
    function procesarCuerpoPreview(texto) {
      if (!texto) return '';

      // Configurar marcado seguro de imágenes
      const renderer = new marked.Renderer();
      renderer.image = function(tokenOrHref, title, text) {
        let href = typeof tokenOrHref === 'object' && tokenOrHref !== null ? (tokenOrHref.href || '') : (tokenOrHref || '');
        let alt = typeof tokenOrHref === 'object' && tokenOrHref !== null ? (tokenOrHref.text || '') : (text || title || '');
        let rutaLimpia = href.startsWith('/') ? '../' + href.substring(1) : '../' + href;
        const leyendaHTML = alt ? `<figcaption class="noticia-leyenda-inline">${alt}</figcaption>` : '';
        return `<figure class="noticia-figura-inline"><div class="marco-imagen-inline"><img src="${rutaLimpia}" alt="${alt}"></div>${leyendaHTML}</figure>`;
      };

      let html = marked.parse(texto, { renderer: renderer });

      // YouTube
      const regexYouTube = /<p>(?:<a[^>]*>)?(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?(?:[^\s<]*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})(?:[^\s<]*)(?:<\/a>)?<\/p>/gi;
      html = html.replace(regexYouTube, function(match, id) {
        return `<div class="iframe-responsive-inline"><iframe src="https://www.youtube-nocookie.com/embed/${id}" frameborder="0" allowfullscreen></iframe></div>`;
      });

      // Twitter / X
      const regexTwitter = /<p>(?:<a[^>]*>)?(?:https?:\/\/)?(?:www\.)?(?:twitter\.com|x\.com)\/([^\s<>\/]+)\/status\/([\d]+)(?:[^\s<]*)(?:<\/a>)?<\/p>/gi;
      html = html.replace(regexTwitter, function(match, user, id) {
        return `<div class="contenedor-red-social"><blockquote class="twitter-tweet" data-dnt="true" align="center"><a href="https://twitter.com/${user}/status/${id}"></a></blockquote></div>`;
      });

      // TikTok
      const regexTikTok = /<p>(?:<a[^>]*>)?(?:https?:\/\/)?(?:www\.)?(?:tiktok\.com)\/@([^\s<>\/]+)\/video\/([\d]+)(?:[^\s<]*)(?:<\/a>)?<\/p>/gi;
      html = html.replace(regexTikTok, function(match, user, id) {
        return `<div class="contenedor-red-social"><blockquote class="tiktok-embed" cite="https://www.tiktok.com/@${user}/video/${id}" data-video-id="${id}" style="max-width: 605px;min-width: 325px;"><section></section></blockquote></div>`;
      });

      return html;
    }

    // VISTA PREVIA DEL EDITOR CON PROCESAMIENTO ACTIVO
    var NoticiasPreview = createClass({
      componentDidMount: function() {
        this.recargarWidgets();
      },
      componentDidUpdate: function() {
        this.recargarWidgets();
      },
      recargarWidgets: function() {
        if (window.twttr && window.twttr.widgets) {
          window.twttr.widgets.load();
        }
      },
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || 'Escribe un titular...';
        var volada = entry.getIn(['data', 'volada']);
        var categoria = entry.getIn(['data', 'categoria']);
        
        var mapaCategorias = { 'politica': 'POLÍTICA', 'internacionales': 'INTERNACIONALES', 'espectaculos': 'ESPECTÁCULOS', 'deportes': 'DEPORTES' };
        var catTexto = categoria ? (mapaCategorias[categoria] || categoria.toUpperCase()) : 'CATEGORÍA';
        
        var date = entry.getIn(['data', 'date']) || 'Fecha de publicación';
        var thumbnail = this.props.getAsset(entry.getIn(['data', 'thumbnail']));
        var pie_foto = entry.getIn(['data', 'pie_foto']);
        var tags = entry.getIn(['data', 'tags']);
        var bodyRaw = entry.getIn(['data', 'body']) || '';

        var tagsElements = [];
        if (tags) {
           var tagArray = tags.split(',');
           for(var i=0; i < tagArray.length; i++){
               tagsElements.push(h('span', {
                 key: i, 
                 className: 'tag-item'
               }, tagArray[i].trim()));
           }
        }

        var cuerpoProcesadoHTML = procesarCuerpoPreview(bodyRaw);

        return h('div', { className: 'noticia-pagina-wrapper' },
          h('article', { className: 'noticia-periodistica-container' },
            
            // Meta Categoría + Volada
            h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px' } },
              h('span', { style: { fontFamily: 'Inter', backgroundColor: '#0e3b2e', color: '#fff', fontSize: '11px', fontWeight: 'bold', padding: '4px 10px', borderRadius: '3px', letterSpacing: '1.5px' } }, catTexto),
              volada ? h('span', { className: 'noticia-volada', style: { marginBottom: 0 } }, "| " + volada.toUpperCase()) : null
            ),
            
            // Titular
            h('h1', { className: 'noticia-titular' }, title),
            
            // Bajada
            h('div', { className: 'noticia-bajada' }, this.props.widgetFor('bajada')),
            
            // Fecha
            h('div', { className: 'noticia-creditos-fecha' }, date.toString()),

            // Foto Principal
            thumbnail ? h('figure', { className: 'noticia-media-wrapper' },
              h('div', { className: 'marco-imagen' },
                h('img', { src: thumbnail.toString(), alt: 'Portada' })
              ),
              pie_foto ? h('figcaption', { className: 'noticia-leyenda' }, pie_foto) : null
            ) : null,

            // Lead
            h('div', { className: 'noticia-lead-destacado' }, this.props.widgetFor('lead')),
            
            // Cuerpo procesado con fotos intermedias y redes sociales activas
            h('div', { 
              className: 'noticia-cuerpo-redaccion',
              dangerouslySetInnerHTML: { __html: cuerpoProcesadoHTML }
            }),
            
            // Tags
            tags ? h('div', { className: 'noticia-sepa-mas' }, 
              h('h3', { style: { fontFamily: 'Inter', fontSize: '15px', color: '#0e3b2e', marginBottom: '12px' } }, "Sepa más:"), 
              h('div', { style: { display: 'flex', flexWrap: 'wrap' } }, tagsElements)
            ) : null
          )
        );
      }
    });

    CMS.registerPreviewTemplate("noticias", NoticiasPreview);
  </script>
</body>
</html>
