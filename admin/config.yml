backend:
  name: git-gateway
  repo: 07lonnie/LA-GACELA
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/6f935bce-10e7-4f4f-acee-854e0d188d8a/pkce
  auth_token_endpoint: /sites/6f935bce-10e7-4f4f-acee-854e0d188d8a/token
  gateway_url: https://gateway.decapbridge.com

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://la-gacela.vercel.app

media_folder: "fotos/subidas"
public_folder: "fotos/subidas"

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "contenido/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "1. Volada / Antetítulo (Opcional)", name: "volada", widget: "string", required: false }
      - { label: "2. Titular Principal", name: "title", widget: "string" }
      - { 
          label: "3. Categoría", 
          name: "categoria", 
          widget: "select", 
          options: [
            { label: "Política", value: "politica" },
            { label: "Internacionales", value: "internacionales" },
            { label: "Espectáculos", value: "espectaculos" },
            { label: "Deportes", value: "deportes" }
          ]
        }
      - { label: "4. Bajada / Sumario", name: "bajada", widget: "markdown", buttons: ["bold", "italic", "link"] }
      - { label: "5. Fecha de Publicación", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "6. Lead / Entradilla", name: "lead", widget: "markdown", required: false, buttons: ["bold", "italic", "link"] }
      - { label: "7. Fotografía Principal", name: "thumbnail", widget: "image", required: false }
      - { label: "8. Leyenda de Foto", name: "pie_foto", widget: "string", required: false }
      - { label: "9. Etiquetas (Separadas por comas)", name: "tags", widget: "string", required: false }
      - { label: "10. Cuerpo de la Noticia", name: "body", widget: "markdown" }